name: Build mxlive v1.0.0

on: [push, workflow_dispatch]

jobs:
  build-android:
    name: Auto-Generate & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ---------------------------------------------------------
      # 🔥 STEP 1: CREATE FRESH PROJECT (mxlive) 🔥
      # ---------------------------------------------------------
      - name: Generate mxlive Project
        run: |
          echo "Generating mxlive project structure..."
          
       
          rm -rf android ios

          flutter create . --org com.mxlive.tv --project-name mxlive
          echo "Generated mxlive project: DONE"

         
          if [ -f google-services.json ]; then
            mv google-services.json android/app/
            echo "Placed google-services.json: DONE"
          else
             echo "⚠️ WARNING: google-services.json not found in root!"
          fi

      # ---------------------------------------------------------
      # 🔥 STEP 2: INJECT CONFIG (Permissions & Firebase) 🔥
      # ---------------------------------------------------------
      - name: Inject Configuration
        run: |
          echo "Injecting permissions and plugins..."

          # Permissions
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          
          # MinSDK Fix
          sed -i 's/flutter.minSdkVersion/23/g' android/app/build.gradle.kts

          # Firebase Plugin (Project Level)
          sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.0" apply false/g' android/settings.gradle.kts

          # Firebase Plugin (App Level)
          sed -i 's/id("com.android.application")/id("com.android.application")\n    id("com.google.gms.google-services")/g' android/app/build.gradle.kts

          # Firebase Dependencies (App Level)
          sed -i 's/dependencies {/dependencies {\n    implementation(platform("com.google.firebase:firebase-bom:32.7.0"))\n    implementation("com.google.firebase:firebase-analytics")/g' android/app/build.gradle.kts

          echo "Configuration Injected."

      # ---------------------------------------------------------
      # 🔥 STEP 3: BUILD 🔥
      # ---------------------------------------------------------
      - name: Generate Icons
        run: |
          if [ ! -f assets/logo.png ]; then mkdir -p assets; curl -L -o assets/logo.png "https://cdn-icons-png.flaticon.com/512/3163/3163478.png"; fi
          flutter pub get
          dart run flutter_launcher_icons

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      - name: Bundle Results
        run: |
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/mxlive-v1.0.0-Universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/mxlive-v1.0.0-Arm64.apk
          cd release_apks && zip -r mxlive-v1.0.0-bundle.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: mxlive-v1.0.0-bundle
          path: release_apks/mxlive-v1.0.0-bundle.zip
